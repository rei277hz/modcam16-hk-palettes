<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>Image decomposition | modCAM16-HK</title>
  </head>
  <body>
    <main class="decompose-shell">
      <h1 class="sr-only">Image decomposition</h1>
      <section class="upload-row" aria-labelledby="input-heading">
        <h2 id="input-heading" class="sr-only">Input image</h2>
        <input id="file-input" type="file" accept=".exr,.jpg,.jpeg,.png,.heic,.heif,image/png,image/jpeg,image/heif,image/heic" hidden />
        <button id="upload-button" class="upload-button" type="button"><svg class="upload-mark" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M3.5 6.5h6l2 2h9v9.5a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2v-9.5a2 2 0 0 1 2-2Z"/><path d="M2.5 10h18"/></svg><span><strong>Load image</strong><small>EXR · JPEG · PNG · HEIC · HEIF</small></span></button>
        <div id="metadata-summary" class="metadata-summary" hidden></div>
        <div class="control-group interpretation-group">
          <button id="override-source" class="override-button" type="button" hidden>Override embedded ICC</button>
          <div id="interpretation-fields" hidden>
            <div class="form-grid">
              <label class="field"><span>Primaries</span><select id="source-gamut"><option value="">Select primaries</option><option value="Rec.709 / sRGB">Rec.709 / sRGB</option><option value="Display P3 / P3-D65">Display P3 / P3-D65</option><option value="Rec.2020">Rec.2020</option><option value="Adobe RGB">Adobe RGB</option><option value="ACEScg">ACEScg</option><option value="ACES2065-1">ACES2065-1</option></select></label>
              <label class="field"><span>Transfer</span><select id="source-transfer"><option value="">Select transfer</option><option value="Linear">Linear</option><option value="sRGB">sRGB</option><option value="Gamma 1.8">Gamma 1.8</option><option value="Gamma 2.2">Gamma 2.2</option><option value="Gamma 2.4 / BT.1886">Gamma 2.4 / BT.1886</option><option value="BT.709 / BT.2020">BT.709 / BT.2020</option><option value="PQ / ST 2084">PQ / ST 2084</option><option value="HLG / BT.2100">HLG / BT.2100</option></select></label>
            </div>
            <p id="interpretation-error" class="validation-message" role="alert" hidden></p>
          </div>
        </div>
        <div id="metadata-warning" class="inline-warning" role="status" hidden></div>
      </section>

      <section class="control-row" aria-label="Decomposition options">
        <div class="control-group options-group">
          <div class="form-grid form-grid-options">
            <label class="field"><span>ACES profile</span><select id="aces-profile"><option value="1">ACES 2.0 - SDR 100 nits (Rec.709)</option><option value="4">ACES 2.0 - SDR 100 nits (P3 D65)</option><option value="2" selected>ACES 2.0 - HDR 1000 nits (P3 D65)</option><option value="0">ACES 2.0 - HDR 1000 nits (Rec.2020)</option></select></label>
            <label class="field"><span>Refl</span><input id="refl" type="number" min="0.000001" max="1.2" step="0.1" value="0.500" inputmode="decimal" /></label>
          </div>
          <p id="options-error" class="validation-message" role="alert" hidden></p>
        </div>
      </section>

      <section class="processing-row" aria-label="Processing">
        <div class="process-controls"><span id="worker-badge" class="status-badge">WebGPU unavailable*</span><button id="calculate-button" class="button button-primary" type="button" disabled>Decompose</button><button id="cancel-button" class="button button-danger" type="button" hidden>Cancel</button></div>
        <div class="progress-block" aria-live="polite"><div class="progress-label-row"><span id="progress-stage">Waiting for an image</span><output id="progress-percent">0%</output></div><progress id="progress-bar" max="100" value="0">0%</progress><div id="progress-counters" class="progress-counters">No pixels processed.</div></div>
        <div id="processing-status" class="inline-status" role="status" hidden></div>
      </section>

      <section class="results-row" aria-label="Previews and downloads">
        <div class="previews"><figure><button id="base-preview-trigger" class="preview-trigger" type="button" disabled aria-label="Open larger base preview"><img id="base-preview-image" alt="Base preview JPEG" hidden /></button><figcaption>Base preview · click to enlarge</figcaption></figure><figure><button id="exposure-preview-trigger" class="preview-trigger" type="button" disabled aria-label="Open larger exposure preview"><img id="exposure-preview-image" alt="Exposure preview JPEG" hidden /></button><figcaption>Exposure preview · click to enlarge</figcaption></figure></div>
        <div class="downloads"><button id="download-base" class="download-button" type="button" disabled><span>Base EXR</span><small id="base-size">Waiting</small></button><button id="download-exposure" class="download-button" type="button" disabled><span>Exposure EXR</span><small id="exposure-size">Waiting</small></button><button id="download-exposure-rgb" class="download-button" type="button" disabled><span>Exposure RGB EXR</span><small id="exposure-rgb-size">Waiting</small></button></div>
      </section>

      <section class="report-row" aria-labelledby="report-heading"><h2 id="report-heading">Analytic report</h2><div id="empty-report" class="empty-state">Complete a calculation to see diagnostics.</div><div id="report-content" hidden><div id="report-summary" class="report-summary"></div><div id="report-warnings" class="inline-warning" hidden></div><dl id="report-metrics" class="metrics"></dl></div></section>
      <footer class="page-footer"><small class="webgpu-footnote">* We use WebGPU to make decomposition and preview generation much faster.</small><a class="picker-link" href="./index.html">Colour picker ↗</a></footer>
    </main>
    <div id="preview-overlay" class="preview-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="preview-overlay-label"><div class="overlay-backdrop" data-close-preview></div><div class="overlay-panel"><div class="overlay-toolbar"><strong id="preview-overlay-label">Preview</strong><button id="close-preview" class="button button-quiet" type="button">Close</button></div><img id="preview-overlay-image" class="overlay-image" alt="" /><div class="overlay-actions"><button id="download-base-preview" class="download-button" type="button" disabled><span>Save base JPEG</span><small id="base-preview-size">Waiting</small></button><button id="download-exposure-preview" class="download-button" type="button" disabled><span>Save exposure JPEG</span><small id="exposure-preview-size">Waiting</small></button></div></div></div>
    <script type="module" src="./src/decompose.ts"></script>
  </body>
</html>
