[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modcam16-palette"
version = "0.1.0"
description = "Equal-perceived-brightness modCAM16-HK radial palette generator"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "OpenEXR>=3.2",
    "opencolorio==2.5.2",
    "Pillow>=10.0",
    "pillow-heif>=0.20",
    "apple-hdr-heic>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
modcam16-palette = "modcam16_palette.cli:main"
modcam16-palette-release = "modcam16_palette.cli:release_main"
modcam16-decompose = "modcam16_palette.decompose:main"

[tool.setuptools.packages.find]
include = ["modcam16_palette*"]

[tool.setuptools.data-files]
"share/modcam16-palette" = ["cg-config-v4.0.0_aces-v2.0_ocio-v2.5.ocio"]

[tool.pytest.ini_options]
pythonpath = ["."]
